# Checks every push to main: the project compiles and the tests pass. Nothing is published.
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Build
        run: dotnet build SMDWin.csproj -c Release

      - name: Tests
        run: dotnet test SMDWin.Tests/SMDWin.Tests.csproj -c Release --logger "console;verbosity=normal"
