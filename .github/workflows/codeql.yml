# Security scan of the C# code (free for public repositories). Results: Security → Code scanning.
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"   # every Monday
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none

      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
