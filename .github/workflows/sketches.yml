# Renders the benchmark drawings to PNG (helper branch only; not part of the app).
name: Render sketches
on:
  push:
    branches: [sketch-render]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  render:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Render
        timeout-minutes: 8
        run: dotnet run --project tools/SketchRender/SketchRender.csproj -c Release -- sketches
      - name: Commit the pictures to this branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -f sketches/*.png
          git commit -m "Rendered sketches"
          git push
